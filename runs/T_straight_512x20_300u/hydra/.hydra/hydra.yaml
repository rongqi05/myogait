hydra:
  run:
    dir: /home/zrq/Documents/musclemimic/runs/T_straight_512x20_300u/hydra
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/home/zrq/Documents/musclemimic/runs/T_straight_512x20_300u/hydra
    - hydra.mode=RUN
    task:
    - wandb.mode=disabled
    - experiment.env_params.num_envs=512
    - experiment.num_envs=512
    - experiment.ppo_config.num_steps=20
    - experiment.ppo_config.num_minibatches=8
    - experiment.actor_hidden_layers=[1024,1024,1024,1024,1024]
    - experiment.critic_hidden_layers=[1024,1024,1024,1024,1024]
    - experiment.total_timesteps=3072000
    - experiment.validation.num=2
    - +experiment.task_factory.params.amass_dataset_conf.rel_dataset_path=[KIT/3/straight_stitched_10s]
    - experiment.task_factory.params.amass_dataset_conf.dataset_group=null
    - +experiment.task_factory.params.amass_dataset_conf.retargeting_method=gmr
    - experiment.validation.active=false
    - experiment.checkpoint_root=/home/zrq/Documents/musclemimic/runs/T_straight_512x20_300u/checkpoints
  job:
    name: experiment
    chdir: null
    override_dirname: +experiment.task_factory.params.amass_dataset_conf.rel_dataset_path=[KIT/3/straight_stitched_10s],+experiment.task_factory.params.amass_dataset_conf.retargeting_method=gmr,experiment.actor_hidden_layers=[1024,1024,1024,1024,1024],experiment.checkpoint_root=/home/zrq/Documents/musclemimic/runs/T_straight_512x20_300u/checkpoints,experiment.critic_hidden_layers=[1024,1024,1024,1024,1024],experiment.env_params.num_envs=512,experiment.num_envs=512,experiment.ppo_config.num_minibatches=8,experiment.ppo_config.num_steps=20,experiment.task_factory.params.amass_dataset_conf.dataset_group=null,experiment.total_timesteps=3072000,experiment.validation.active=false,experiment.validation.num=2,wandb.mode=disabled
    id: ???
    num: ???
    config_name: conf_fullbody
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.8
    version_base: '1.3'
    cwd: /home/zrq/Documents/musclemimic
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/zrq/Documents/musclemimic/external/MuscleMimic/fullbody
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/zrq/Documents/musclemimic/runs/T_straight_512x20_300u/hydra
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
